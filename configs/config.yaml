# D&D Campaign Manager Configuration
#
# ${VAR} placeholders are expanded from the environment when this file is read,
# so secrets stay in .env. See .env.example.

# Application Settings
app:
  host: "0.0.0.0"
  port: 8080
  environment: "development"
  debug: true

# MongoDB Configuration (MongoDB Atlas)
mongodb:
  uri: "${MONGODB_URI}"  # MongoDB Atlas connection string
  database: "dnd_campaigns"
  username: ""  # Already in URI
  password: ""  # Already in URI
  auth_source: "admin"
  max_pool_size: 100
  min_pool_size: 10
  connect_timeout: "10s"

# AI provider (any OpenAI-compatible /chat/completions endpoint).
#
# Switching providers is a config change only -- no Go code refers to a
# specific vendor. To move to DeepSeek instead:
#   base_url: "https://api.deepseek.com"
#   model: "deepseek-chat"
#   pricing: 0.14 / 0.28
ai:
  provider: "groq"          # label for logs; base_url is what actually routes
  api_key: "${GROQ_API_KEY}"
  base_url: "https://api.groq.com/openai/v1"

  # Groq retires and renames models regularly. Confirm this ID is still served
  # before relying on it:  curl -H "Authorization: Bearer $GROQ_API_KEY" \
  #   https://api.groq.com/openai/v1/models
  model: "llama-3.3-70b-versatile"

  # Groq answers in well under a second; a long timeout only delays surfacing
  # a genuine problem.
  timeout: "10s"
  max_retries: 3

  # USD per million tokens. Check your provider's current pricing page -- these
  # are estimates for cost reporting only, never billing. Leave both at 0 to
  # disable cost estimation entirely.
  pricing:
    prompt_usd_per_million: 0.59
    completion_usd_per_million: 0.79

# CORS. List the origins your UI is served from; leave empty for no browser
# client. "*" reflects whatever asks, which is convenient locally and wrong in
# production.
cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allow_credentials: false

# How much campaign history reaches a prompt.
#
# The event log grows without limit and a context window does not, so older
# events are folded into a rolling summary and only the recent ones are sent
# verbatim. Token counts are estimates -- deliberately generous, since an
# under-count gets the request refused.
memory:
  max_tokens: 1200      # ceiling for the history block; 0 removes it
  min_recent: 3         # newest events that survive any budget
  window: 60            # most events ever read for one prompt
  compact_after: 40     # un-summarised events that trigger a compaction
  retain: 15            # events left verbatim after one

  # Reuse of scene descriptions. Only an identical prompt hits, so a party
  # walking back into a room they have had described is free, while anything
  # that has changed is not. 0 disables it.
  cache_size: 0
  cache_ttl: "30m"

# Logging Configuration
logging:
  level: "debug"
  format: "json"
  output: "stdout"

# Rate limiting, per client address. Set requests_per_minute to 0 to disable.
rate_limit:
  requests_per_minute: 60
  burst: 10
  ai_requests_per_hour: 100

# Dice Settings
dice:
  default_sides: 20
  enable_advantage: true
  enable_fudge: false

# Combat Settings
combat:
  auto_initiative: true
  round_duration_seconds: 60
  max_turn_time_seconds: 120
